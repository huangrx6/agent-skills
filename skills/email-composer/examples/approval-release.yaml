type: approval
secondary: [handover, confirm]
audience: 上级（内部）
tone: 正式、简洁
to: 王总 <wang@example.com>
subject: 【申请】Orbit 工作台上线申请（2026-11-20 20:00）
greeting: 王总，您好
summary: >-
  申请于 2026-11-20 20:00 发布 Orbit 工作台，请审批。发布窗口预计 2 小时，
  回滚演练已经完成。
blocks:
