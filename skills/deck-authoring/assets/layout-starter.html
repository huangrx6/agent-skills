<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>按章节展开 · 布局草稿</title>
  <!-- web_deck.py injects web-layouts.css when compiling this source.
       This is a neutral structure sample, not a finished visual design.
       Design the project's visual language from its content and brief.
       references/refined-workflow.md explains reference discovery and shared design decisions.
       references/visual-craft.md gives scale, grid, image, material and anti-slop levers.
       Use this structure after the current project's design direction is established.
       Page count, sequence, typography and media are illustrative, not requirements.
       The default tokens are a presentation baseline: title 64 / body 26 on 1600×900.
       A cover uses the display scale; dense reading pages can lower the tokens.
       This example includes a concept-image slot. Provide a suitable asset,
       or an image brief if generation is needed; adapt it to the project.
       The missing file is intentional in this draft and blocks final delivery. -->
</head>
<body>
  <section class="slide" data-slide="1" data-title="第一章：先建立共同的问题">
    <div class="deck-page" data-layout="cover" data-viewing="screen">
      <header class="deck-header">
        <p class="deck-caption">01 / 章节开场</p>
        <h1>先建立共同的问题</h1>
      </header>
      <main class="deck-body">
        <div class="deck-copy">
          <p class="deck-block deck-lead">这一章只回答：我们希望读者先理解什么？</p>
          <p class="deck-block">先给出背景，再用下一页展开一个具体解释。</p>
        </div>
      </main>
      <footer class="deck-footer"><span>结构草稿 · 视觉待设计</span><span>01 / 03</span></footer>
    </div>
  </section>
  <section class="slide" data-slide="2" data-title="让图文共同解释问题">
    <div class="deck-page" data-layout="image-right" data-viewing="screen">
      <header class="deck-header">
        <p class="deck-caption">01 / 一个解释</p>
        <h1>让图文共同解释问题</h1>
      </header>
      <main class="deck-body">
        <div class="deck-copy">
          <p class="deck-block">正文给出结论，配图帮助理解这一页的关系。</p>
          <p class="deck-block">信息较多时重组或拆讲；需要同屏比较时保留完整关系。</p>
        </div>
        <figure class="deck-media">
          <img src="assets/chapter-focus.png" width="1600" height="1200"
               alt="待素材：解释本页主题的概念配图，按项目内容和素材要求制作。">
          <figcaption class="deck-caption">待回填的概念配图 · 当前为结构草稿</figcaption>
        </figure>
      </main>
      <footer class="deck-footer"><span>结构草稿 · 素材待回填</span><span>02 / 03</span></footer>
    </div>
  </section>
  <section class="slide" data-slide="3" data-title="收束本章，再进入下一章">
    <div class="deck-page" data-layout="statement" data-viewing="screen">
      <header class="deck-header">
        <p class="deck-caption">01 / 本章结论</p>
        <h1>收束本章，再进入下一章</h1>
      </header>
      <main class="deck-body">
        <div class="deck-copy">
          <p class="deck-block">读者先记住一个清楚的结论，再接收下一组信息。</p>
        </div>
      </main>
      <footer class="deck-footer"><span>结构草稿 · 视觉待设计</span><span>03 / 03</span></footer>
    </div>
  </section>
</body>
</html>
