<div class="docs-shell @@SHELL_CLASS@@">
  @@SIDEBAR@@
  <div class="sidebar-backdrop" data-sidebar-close hidden></div>
  <main id="main" class="docs-main">
    <button class="sidebar-toggle" type="button" aria-expanded="false" aria-controls="docs-sidebar">
      <span>文档导航</span><span class="sidebar-toggle-mark" aria-hidden="true">+</span>
    </button>
    @@CRUMBS@@
    <header class="page-head">
      <p class="eyebrow">@@EYEBROW@@</p>
      <h1>@@PAGE_TITLE@@</h1>
      @@LEAD@@
      @@META@@
    </header>
    <article class="prose">
      @@CONTENT@@
    </article>
    @@PAGE_NAV@@
  </main>
@@TOC@@
</div>
